<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BIM Мониторинг — AERBIM</title>
<style>
  :root { --bg: #0A1A2C; --fg: #FFFFFF; --muted: #A5CAE4; --accent: #26AAE1; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 0 16px; box-sizing: border-box;
  }
  main { text-align: center; }
  h1 { margin: 0 0 20px; }
  .logo {
    display: inline-block; background: #FFFFFF; border-radius: 12px;
    padding: clamp(14px, 3vw, 24px) clamp(18px, 4vw, 32px);
  }
  .logo img { display: block; width: min(420px, 70vw); height: auto; }
  p { margin: 0; color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1><span class="logo"><img src="logo.png" alt="AERBIM Engineering Systems" width="604" height="129"></span></h1>
  <p><b style="color:#fff">BIM Мониторинг</b><br>Презентация готовится</p>
</main>
</body>
</html>
